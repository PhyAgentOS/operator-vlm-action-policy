name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen python -m compileall -q src tests scripts
      - run: uv run --frozen python scripts/check_publication.py
      - run: uv run --frozen operator-vlm-action-policy validate --config examples/libero/policy.yaml
      - run: uv run --frozen operator-vlm-action-policy validate --config examples/joint/policy.yaml
      - run: uv build
