[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "operator-vlm-action-policy"
version = "0.1.0"
description = "Standalone vision-language action policy node for PhyAgentOS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dora-rs==0.4.1",
  "forge-msgs==1.2.0",
  "numpy>=1.26,<3",
  "pyarrow>=14,<24",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
]

[project.scripts]
operator-vlm-action-policy = "vlm_action_policy.main:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9", "pyinstaller>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_action_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff]
line-length = 100
target-version = "py312"
