[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "operator-vlm-action-policy"
version = "0.1.0"
description = "Persistent observation-to-action policy using the generic PhyAgentOS VLM service"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "PhyAgentOS Contributors"}]
dependencies = ["httpx>=0.27,<1", "numpy>=1.26,<3", "pydantic>=2.9,<3", "PyYAML>=6,<7", "Pillow>=13,<14"]

[project.optional-dependencies]
dora = ["dora-rs==0.4.1", "pyarrow>=14,<24"]

[project.scripts]
operator-vlm-action-policy = "operator_vlm_action_policy.cli:main"

[project.urls]
Repository = "https://github.com/PhyAgentOS/operator-vlm-action-policy"
Issues = "https://github.com/PhyAgentOS/operator-vlm-action-policy/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/operator_vlm_action_policy"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/scripts", "/.github", "/README*", "/DEVELOPING*", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md", "/SECURITY.md", "/CONTRIBUTING.md", "/OPEN_SOURCE_AUDIT.md", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock", "/.gitignore", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
