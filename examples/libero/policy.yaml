# DESIGN ONLY: proposed configuration contract; no parser/runtime is implemented.
policy_id: vlm_libero
model:
  backend: provider_api
  # This Node calls the configured model provider directly.
  # A local in-process model backend is another planned option.
  api_base_env: VLM_API_BASE
  api_key_env: VLM_API_KEY
  model_name_env: VLM_MODEL
  effort_env: VLM_REASONING_EFFORT
instruction_source: policy_command
observation:
  image_inputs:
    image/main: main
    image/second: wrist
  state_semantics: [eef_x_m, eef_y_m, eef_z_m, eef_rx_rad, eef_ry_rad, eef_rz_rad, finger_left_m, finger_right_m]
  synchronization: legacy_lockstep
  # Production extension: explicit episode/step identity on every stream.
action:
  space: eef_delta
  frame: world
  gripper: normalized
  dt_s: 0.05
  chunk_horizon: 4
  execute_horizon: 2
control_adapter:
  type: libero_osc_delta
  # Example values: verify against the selected controller before use.
  translation_scale_m: 0.05
  rotation_scale_rad: 0.5
lifecycle:
  reset_history_per_episode: true
  reject_stale_results: true
