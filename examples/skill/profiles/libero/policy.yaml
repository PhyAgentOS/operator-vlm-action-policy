policy_id: vlm_libero
service_url: http://127.0.0.1:19120
auto_start: false
transport: legacy_libero
action_space: eef_delta
controller: libero_osc_delta
frame: world
instruction: ""
prompt: >-
  Control the robot to follow the supplied task using only observed images and robot state.
  Return the requested JSON action chunk. Use short bounded moves, consider both cameras,
  and account for the last acknowledged actions. Never claim an action was executed.
max_chunk: 4
execute_horizon: 2
dt_s: 0.05
max_translation: 0.02
max_rotation: 0.2
# Verify these against the installed robosuite OSC controller before real evaluation.
translation_scale: 0.05
rotation_scale: 0.5
image_inputs:
  image/main: main
  image/second: wrist
state_names: [joint1, joint2, joint3, joint4, joint5, joint6, joint7, gripper]
state_semantics: [eef_x_m, eef_y_m, eef_z_m, eef_rx_rad, eef_ry_rad, eef_rz_rad, finger_left_m, finger_right_m]
action_names: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
deadline_ms: 60000
observation_timeout_s: 120
max_output_tokens: 2048
