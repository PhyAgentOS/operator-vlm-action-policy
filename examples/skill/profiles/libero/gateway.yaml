host: 127.0.0.1
port: 19033
joint_order: []
image_input_ids: []
readiness:
  require_proprio_state: false
  require_images: false
tools:
  enabled: true
  lease_ttl_ms: 120000
  invoke_timeout_ms: 180000
  request_input_id: tool_request
  response_output_id: tool_response
  specs:
  - tool_id: vlm_libero.benchmark.describe
    implementation_id: vlm-libero.benchmark
    endpoint_id: benchmark.controller
    operation: describe
    semantics: query
    description: Read capabilities.
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
    output_schema:
      type: object
      additionalProperties: true
    readiness: []
  - tool_id: vlm_libero.benchmark.run
    implementation_id: vlm-libero.benchmark
    endpoint_id: benchmark.controller
    operation: run
    semantics: session
    description: Run one batch; stop at episode boundary; read terminal result.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        suite:
          enum:
          - libero_spatial
          - libero_object
          - libero_goal
          - libero_10
        task_ids:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 0
        init_state_ids:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 0
        num_runs:
          type: integer
          minimum: 1
        max_steps:
          type: integer
          minimum: 1
          maximum: 1000
        seed:
          type: integer
          minimum: 0
      required:
      - suite
    output_schema:
      type: object
      additionalProperties: true
    readiness: []
  providers:
  - endpoint_id: benchmark.controller
    input_id: benchmark_tool_in
    output_id: benchmark_tool_out
