# DESIGN ONLY. Scenario B: proposed VLA-conditioned VLM action Node.
# Correlated benchmark observations and candidate lifecycle interfaces need extensions.
policy_id: vlm_libero_final
mode: vla_conditioned
model:
  backend: provider_api
  api_base_env: VLM_API_BASE
  api_key_env: VLM_API_KEY
  model_name_env: VLM_MODEL
  effort_env: VLM_REASONING_EFFORT
observation:
  image_inputs:
    image/main: main
    image/second: wrist
  state_semantics:
  - eef_x_m
  - eef_y_m
  - eef_z_m
  - eef_rx_rad
  - eef_ry_rad
  - eef_rz_rad
  - finger_left_m
  - finger_right_m
  synchronization: correlated_observation
  require_identity: true
action:
  space: eef_delta
  frame: world
  dimension: 7
  layout:
  - dx
  - dy
  - dz
  - drx
  - dry
  - drz
  - gripper
  units:
  - m
  - m
  - m
  - rad
  - rad
  - rad
  - normalized
  gripper_convention: minus1_open_plus1_close
  prediction_horizon: 4
  max_prediction_horizon: 8
  execute_horizon: 2
  control_dt_s: 0.05
control_adapter:
  type: libero_osc_delta
  native_dimension: 7
  translation_scale_m: 0.05
  rotation_scale_rad: 0.5
  limits_source: robot_control_profile
runtime:
  tick_ms: 20
  inference_deadline_ms: 60000
  feedback_timeout_ms: 5000
  on_error: abort_evaluation
  async_prefetch: false
context:
  scope: episode
  max_executed_history: 4
  include_unexecuted_actions: false
lifecycle:
  reset_history_per_episode: true
  reject_stale_results: true
candidate:
  required: true
  policy_id: vla_libero_candidate
  expected_horizon: 8
  dimension: 7
  require_same_action_contract: true
  request_on_replan_only: true
  deadline_ms: 3000
  max_age_control_steps: 0
  on_timeout: abort_evaluation
refinement:
  strategy: bounded_residual
  max_translation_correction_m: 0.005
  max_rotation_correction_rad: 0.05
  allow_gripper_override: false
